{% extends "base.html" %}

{% block content %}
<h2>Publishers</h2>
<a href="{% url 'publisher_create' %}" class="btn btn-primary mb-3">Add Publisher</a>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Manager</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for publisher in publishers %}
        <tr>
            <td>{{ publisher.name }}</td>
            <td>{{ publisher.description }}</td>
            <td>{{ publisher.manager.username }}</td>
            <td>
                <a href="{% url 'publisher_edit' publisher.id %}" class="btn btn-sm btn-secondary">Edit</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No publishers found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
