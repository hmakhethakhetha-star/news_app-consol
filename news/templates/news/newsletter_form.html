{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>{{ newsletter.title|default:"Create Newsletter" }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'journalist_newsletter_dashboard' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
